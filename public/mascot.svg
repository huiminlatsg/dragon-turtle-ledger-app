    <path d="M96 334 C96 214 176 140 262 140 C348 140 424 214 424 334 Z" fill="#f6b93b" stroke="#6b4300"/>
    <path d="M262 140 L262 182 M150 262 L210 246 M374 262 L314 246 M130 318 L196 292 M394 318 L328 292" fill="none" stroke="#6b4300" stroke-width="7"/>
    <!-- coin on the shell -->
