    <!-- tail -->
    <path d="M100 336 Q58 338 48 384 Q84 372 112 356 Z" fill="#6fd6a0"/>
    <!-- legs -->
    <rect x="138" y="318" width="76" height="78" rx="30" fill="#6fd6a0"/>
