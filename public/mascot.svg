    <path d="M380 344 C380 286 396 252 424 240 L478 292 L440 352 Z" fill="#6fd6a0"/>
    <circle cx="452" cy="250" r="78" fill="#6fd6a0"/>
    <ellipse cx="496" cy="272" rx="17" ry="12" fill="#b6f2d0"/>
    <!-- face -->
    <circle cx="456" cy="232" r="24" fill="#ffffff"/>
    <circle cx="463" cy="234" r="13" fill="#063b36" stroke="none"/>
    <circle cx="468" cy="228" r="5" fill="#ffffff" stroke="none"/>
    <circle cx="459" cy="240" r="2.5" fill="#ffffff" stroke="none"/>
