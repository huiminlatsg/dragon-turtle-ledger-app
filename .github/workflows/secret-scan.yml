# Secret scan for documentation changes. CI skips docs-only changes (pm/,
# docs/, any .md), but a token pasted into a guide or handoff note must still
# be caught. CI scans everything else itself, as part of its single job.
# Scans only the new commits, on the pull request (not again after the merge: nothing new to scan).
# Draft PRs are scanned when marked ready. B-29.
#
# A PR that changes both code and docs is scanned twice (here and in CI):
# about one extra minute, accepted so that no change goes unscanned.
name: Secret scan and privacy guard (docs)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["pm/**", "docs/**", "**/*.md"]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Privacy guard (no family data in this public repo)
        run: scripts/ci-run.sh "Privacy guard" python3 scripts/privacy-guard.py
      - name: Scan new commits for leaked keys and passwords
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          range=""
          if [ -n "$base" ] && [ "$base" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$base^{commit}" 2>/dev/null; then range="$base..HEAD"; fi
          scripts/ci-run.sh "Secret scan" docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --no-banner ${range:+--log-opts="$range"}
