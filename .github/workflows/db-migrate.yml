# Applies database migrations:
#   - to STAGING when a pull request that changes migrations is opened or updated
#   - to PRODUCTION when that change is merged to main
# Skips quietly until the Supabase secrets are set (see docs/SETUP.md).
name: Database migrations

on:
  pull_request:
    # Draft PRs don't apply migrations to staging; marking the PR ready does (B-29).
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["supabase/migrations/**"]
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which database"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    # Never for pull requests from forks: they must not reach the staging database or settings.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event_name == 'push' && 'production' || 'staging') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick project
        id: pick
        env:
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          STAGING_PW: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          PROD_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          PROD_PW: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
        run: |
          if [ "$TARGET" = production ]; then REF="$PROD_REF"; PW="$PROD_PW"; else REF="$STAGING_REF"; PW="$STAGING_PW"; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ] || [ -z "$PW" ]; then
            echo "::notice::Supabase secrets for $TARGET are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$PW"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "SUPABASE_DB_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        if: steps.pick.outputs.skip != 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/sb" supabase@latest
          echo "$RUNNER_TEMP/sb/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Prepare other PR migration versions in shared staging
        if: steps.pick.outputs.skip != 'true' && env.TARGET == 'staging'
        env:
          STAGING_PROJECT_REF: ${{ steps.pick.outputs.ref }}
          EXPECTED_STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: python3 scripts/prepare_staging_migrations.py

      - name: Apply migrations to ${{ env.TARGET }}
        if: steps.pick.outputs.skip != 'true'
        run: |
          [ -f supabase/config.toml ] || echo "n" | supabase init
          scripts/ci-run.sh "Link project" supabase link --project-ref "${{ steps.pick.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"
          scripts/ci-run.sh "Apply migrations" supabase db push --password "$SUPABASE_DB_PASSWORD"
