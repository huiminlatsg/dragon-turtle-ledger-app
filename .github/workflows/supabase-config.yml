# Pushes supabase/config.toml (sign-in settings, Google sign-in) to Supabase:
#   - to STAGING when a pull request that changes them is opened or updated
#   - to PRODUCTION when that change is merged to main
# Skips quietly until the Supabase secrets are set (see docs/SETUP.md).
name: Supabase settings

on:
  pull_request:
    # Draft PRs don't push settings to staging; marking the PR ready does (B-29).
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["supabase/config.toml", ".github/workflows/supabase-config.yml"]
  push:
    branches: [main]
    paths: ["supabase/config.toml", ".github/workflows/supabase-config.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Which project"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: supabase-config
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    # Never for pull requests from forks: they must not reach the staging database or settings.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.event_name == 'push' && 'production' || 'staging') }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick project
        id: pick
        env:
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          PROD_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ "$TARGET" = production ]; then REF="$PROD_REF"; else REF="$STAGING_REF"; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$REF" ]; then
            echo "::notice::Supabase secrets for $TARGET are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sign-in is with Google only, so the settings wait for the Google secrets (docs/SETUP.md Part 6).
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET secrets are not set yet, so sign-in settings can't be pushed. See docs/SETUP.md Part 6."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # Google's client ID and secret come from GitHub secrets and never sit in the repo.
      - name: Add Google sign-in settings
        if: steps.pick.outputs.skip != 'true'
        run: |
          cat >> supabase/config.toml <<'TOML'

          [auth.external.google]
          enabled = true
          client_id = "env(GOOGLE_CLIENT_ID)"
          secret = "env(GOOGLE_CLIENT_SECRET)"
          TOML

      - name: Install Supabase CLI
        if: steps.pick.outputs.skip != 'true'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/sb" supabase@latest
          echo "$RUNNER_TEMP/sb/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Push settings to ${{ env.TARGET }}
        if: steps.pick.outputs.skip != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: scripts/ci-run.sh "Push Supabase settings" supabase config push --project-ref "${{ steps.pick.outputs.ref }}" --yes
